[project]
name = "tartib"
version = "0.1.0"
description = "Tartib personal capture system, backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",  # TestClient transport
  "itsdangerous>=2.2",
  "pydantic>=2.8",
  "pywebpush>=2.5.0",  # Web Push for reminders; pulls cryptography
  "cryptography>=50.0.1",  # imported directly by tartib.vapid
  "py-vapid>=1.9.4",  # imported directly by tartib.vapid and push.check_key
  "mcp>=2.2.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tartib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() in defaults is the FastAPI idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = ["eval: runs the real Codex CLI; select with `pytest -m eval`"]
